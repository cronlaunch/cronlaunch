[package]
name = "cronlaunch"
version = "0.2.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Simplified LaunchAgents management for macOS using crontab-like syntax."
authors = ["Nels Nelson <nels@nelsnelson.org>"]
repository = "https://gitlab.com/nelsnelson/cronlaunch"
homepage = "https://gitlab.com/nelsnelson/cronlaunch"
readme = "README.md"
keywords = ["launchd", "launchagent", "macos", "scheduler", "cli"]
categories = ["command-line-utilities", "os::macos-apis"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
env_logger = "0.11"
log = "0.4"
plist = "1.7"
thiserror = "1.0"
which = "6.0"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

[[bin]]
name = "cronl"
path = "src/bin/cronl.rs"

[[bin]]
name = "watchl"
path = "src/bin/watchl.rs"

[[bin]]
name = "loginl"
path = "src/bin/loginl.rs"
