image: rust:1.96

default:
  before_script:
    - rustup component add rustfmt clippy

stages:
  - check
  - test
  - package
  - publish

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/target/cargo-home"

cache:
  key:
    files:
      - Cargo.lock
  paths:
    - target/

format:
  stage: check
  script:
    - cargo fmt --check

clippy:
  stage: check
  script:
    - cargo clippy --all-targets --all-features --locked -- -D warnings

docs:
  stage: check
  script:
    - RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --locked

test:
  stage: test
  script:
    - cargo test --all-targets --locked

package:
  stage: package
  script:
    - cargo package --locked

publish:
  stage: publish
  resource_group: crates-io
  script:
    - PACKAGE_ID="$(cargo pkgid --package cronlaunch)"
    - VERSION="${PACKAGE_ID##*#}"
    - test "$CI_COMMIT_TAG" = "v$VERSION"
    - cargo publish --locked
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ && $CI_COMMIT_REF_PROTECTED == "true"'
    - when: never
